name: XiaoHaCar
options:
  bundleIdPrefix: com.xiaoha.car
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  XiaoHaCore:
    path: .

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  XiaoHaCar:
    type: application
    platform: iOS
    sources:
      - path: App/XiaoHaCar
      - path: App/Shared
      - path: App/Intents
    resources:
      - path: App/XiaoHaCar/Icons
    dependencies:
      - package: XiaoHaCore
        product: XiaoHaCore
      - target: XiaoHaWidgetExtension
        embed: true
    info:
      path: App/XiaoHaCar/Info.plist
      properties:
        CFBundleDisplayName: 小哈车控
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon76
              - AppIcon167
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.xiaoha.car.refresh
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.xiaoha.car
            CFBundleURLSchemes:
              - xiaohacar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoha.car
        PRODUCT_NAME: 小哈车控
        CODE_SIGN_ENTITLEMENTS: App/XiaoHaCar/XiaoHaCar.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"

  XiaoHaWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: App/XiaoHaWidget
    dependencies:
      - package: XiaoHaCore
        product: XiaoHaCore
    info:
      path: App/XiaoHaWidget/Info.plist
      properties:
        CFBundleDisplayName: 小哈车控
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoha.car.widget
        PRODUCT_NAME: XiaoHaWidgetExtension
        CODE_SIGN_ENTITLEMENTS: App/XiaoHaWidget/XiaoHaWidget.entitlements
        SKIP_INSTALL: YES

schemes:
  XiaoHaCar:
    build:
      targets:
        XiaoHaCar: all
    run:
      config: Debug
    archive:
      config: Release
