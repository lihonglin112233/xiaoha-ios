name: build-ipa

# 在 macOS runner 上编译出未签名 .ipa，用于 Sideloadly / AltStore 自签安装。
on:
  push:
    branches: [main]
    paths-ignore: ["*.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      unsigned_only:
        description: "只出未签名 ipa（自签安装用）"
        type: boolean
        default: true

jobs:
  test:
    name: 单元测试（Linux，零依赖核心层）
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: 跑核心层测试
        run: swift test

  build:
    name: 编译 ipa
    needs: test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode 并确保 iOS 平台可用
        run: |
          set -euo pipefail
          # 优先挑一个确实装了 iOS SDK 的 Xcode 版本
          for candidate in /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app \
                           /Applications/Xcode_16.0.app /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              echo "selected: $candidate"
              break
            fi
          done
          xcodebuild -version
          echo "--- 已安装的 SDK ---"
          xcodebuild -showsdks | sed -n '1,40p' || true
          # 平台缺失时真正安装：Xcode 15+ 支持 -downloadPlatform
          if ! xcodebuild -showsdks | grep -q "iphoneos"; then
            echo "iphoneos SDK 缺失，尝试下载 iOS 平台组件"
            sudo xcodebuild -runFirstLaunch || true
            sudo xcodebuild -downloadPlatform iOS || true
            xcodebuild -showsdks | sed -n '1,40p' || true
          fi

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 解析 Swift Package 依赖
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project XiaoHaCar.xcodeproj \
            -scheme XiaoHaCar

      # Xcode 16 不允许对 iOS SDK 目标直接 ad-hoc 签名（"Ad Hoc code signing is
      # not allowed with SDK 'iOS 18.0'"）。正确做法：先不签名编译，再离线 codesign -s -。
      # 这也是 TrollStore 的常规流程。
      - name: 编译并归档（不签名）
        run: |
          set -euo pipefail
          COMMON_ARGS=(
            -project XiaoHaCar.xcodeproj
            -scheme XiaoHaCar
            -configuration Release
            -archivePath build/XiaoHaCar.xcarchive
            CODE_SIGN_IDENTITY=
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGNING_ALLOWED=NO
            ENABLE_USER_SCRIPT_SANDBOXING=NO
            ONLY_ACTIVE_ARCH=NO
          )
          # 优先用 generic destination；若该 Xcode 未装 iOS 平台，退回纯 iphoneos SDK 编译
          if ! xcodebuild archive "${COMMON_ARGS[@]}" -destination "generic/platform=iOS"; then
            echo "===== destination 模式失败，改用 -sdk iphoneos 重试 ====="
            rm -rf build/XiaoHaCar.xcarchive
            xcodebuild archive "${COMMON_ARGS[@]}" -sdk iphoneos \
              SUPPORTS_MACCATALYST=NO
          fi

      - name: 离线 ad-hoc 签名
        run: |
          set -euo pipefail
          APPS_DIR="build/XiaoHaCar.xcarchive/Products/Applications"
          APP_PATH="$(find "$APPS_DIR" -maxdepth 1 -name '*.app' | head -1)"
          echo "APP_PATH=$APP_PATH"
          # 先签内嵌扩展，再签主 App，顺序不能反。
          # 必须显式传 --entitlements，否则 App Group 不会进入 app，小组件拿不到数据。
          ENT_DIR="App"
          find "$APP_PATH" -name "*.appex" -maxdepth 3 -print0 | while IFS= read -r -d '' appex; do
            echo "codesign appex: $appex"
            codesign --force --sign - --timestamp=none \
              --entitlements "$ENT_DIR/XiaoHaWidget/XiaoHaWidget.entitlements" "$appex"
          done
          echo "codesign app: $APP_PATH"
          codesign --force --sign - --timestamp=none \
            --entitlements "$ENT_DIR/XiaoHaCar/XiaoHaCar.entitlements" "$APP_PATH"
          echo "--- 校验 ---"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | head -12
          codesign --verify --deep --strict "$APP_PATH" && echo "verify OK"
          echo "--- 确认 App Group 已写入 ---"
          codesign -d --entitlements - "$APP_PATH" 2>&1 | head -20

      - name: 打包成 ipa
        run: |
          set -euo pipefail
          APPS_DIR="build/XiaoHaCar.xcarchive/Products/Applications"
          APP_PATH="$(find "$APPS_DIR" -maxdepth 1 -name '*.app' | head -1)"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          rm -f XiaoHaCar.ipa
          zip -qry XiaoHaCar.ipa Payload
          ls -lh XiaoHaCar.ipa
          shasum -a 256 XiaoHaCar.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: XiaoHaCar-ipa
          path: build/XiaoHaCar.ipa
          retention-days: 30

      - name: 归档 dSYM（便于定位崩溃）
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dSYM
          path: build/XiaoHaCar.xcarchive/dSYMs
          retention-days: 7
